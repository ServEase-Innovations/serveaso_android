apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"


/**
 * React Native Config (Environment Files)
 */
// project.ext.envConfigFiles = [
//     dev : ".env.dev",
//     qa  : ".env.qa",
//     prod: ".env.prod"
// ]
project.ext.envConfigFiles = [
    devDebug   : ".env.dev",
    devRelease : ".env.dev",

    qaDebug    : ".env.qa",
    qaRelease  : ".env.qa",

    prodDebug  : ".env.prod",
    prodRelease: ".env.prod"
]

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

react {
    autolinkLibrariesWithApp()
}


/**
 * Proguard toggle
 */
def enableProguardInReleaseBuilds = false

/**
 * JSC Flavor
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'


android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.serveaso"

    defaultConfig {
        applicationId "com.serveaso"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        manifestPlaceholders = [
            auth0Domain: "dev-y0yafxo2cjqtu8y2.us.auth0.com",
            auth0Scheme: "${applicationId}.auth0"
        ]

        ndkVersion "27.1.12297006"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            storeFile file(MYAPP_UPLOAD_STORE_FILE)
            storePassword MYAPP_UPLOAD_STORE_PASSWORD
            keyAlias MYAPP_UPLOAD_KEY_ALIAS
            keyPassword MYAPP_UPLOAD_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    /**
     * ENVIRONMENT FLAVORS
     */
    flavorDimensions "env"
   

    productFlavors {
        dev {
            dimension "env"
            
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
             resValue "string", "app_name", "Serveaso Dev"
        }
        qa {
            dimension "env"
            
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa"
                resValue "string", "app_name", "Serveaso QA"
        }
        prod {
            dimension "env"
          
             applicationIdSuffix ".prod"
        resValue "string", "app_name", "Serveaso"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.google.android.gms:play-services-location:21.0.1")
    implementation("com.google.android.gms:play-services-maps:18.2.0")
    implementation "com.razorpay:checkout:1.6.20"

    // Latest Google Location + AppCompat
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
