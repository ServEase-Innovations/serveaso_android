name: Android CI

on:
  push:
    branches:
      - "**"

  workflow_dispatch:
    inputs:
      branch:
        description: "Select the branch to build"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - develop
          - staging
          - production

jobs:
  ci-build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # CHECKOUT BRANCH
      # ------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      # ------------------------------------------------------
      # GLOBAL GRADLE MEMORY FIX
      # ------------------------------------------------------
      - name: Configure Global Gradle Memory
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx2048m
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.workers.max=4
          android.useFullClasspathForDexingTransform=true
          EOF

      # ------------------------------------------------------
      # KEYSTORE SETUP
      # ------------------------------------------------------
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Add signing properties
        run: |
          cat <<EOF >> android/gradle.properties
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          EOF

      # ------------------------------------------------------
      # JAVA SETUP
      # ------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------------------------------
      # AUTO VERSIONING
      # ------------------------------------------------------
      - name: Auto Versioning
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 || echo "v0.0.0")
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="$LAST_TAG+build.$VERSION_CODE"

          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Apply version to build.gradle
        run: |
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      # ------------------------------------------------------
      # NODE SETUP
      # ------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      # ------------------------------------------------------
      # BUILD RELEASE APK
      # ------------------------------------------------------
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      # ------------------------------------------------------
      # UPLOAD ARTIFACT
      # ------------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # ------------------------------------------------------
      # FIREBASE DISTRIBUTION (FINAL WORKING VERSION)
      # ------------------------------------------------------
      - name: Distribute to Firebase App Distribution
        run: |
          # Write service account JSON safely (NO formatting issues)
          printf '%s' "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > service-account.json

          # Authenticate Firebase using Service Account
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service-account.json"

          # Install Firebase CLI
          npm install -g firebase-tools

          # Validate auth works
          firebase apps:list --project "${{ secrets.FIREBASE_PROJECT_ID }}"

          # Upload to Firebase App Distribution
          firebase appdistribution:distribute "android/app/build/outputs/apk/release/app-release.apk" \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --testers "${{ secrets.FIREBASE_TESTERS }}" \
            --release-notes "Build ${{ env.VERSION_NAME }}"
