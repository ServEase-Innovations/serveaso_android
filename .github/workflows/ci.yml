name: Android CI

on:
  push:
    branches:
      - "**"

  workflow_dispatch:
    inputs:
      branch:
        description: "Select the branch to build"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - develop
          - staging
          - production

jobs:
  ci-build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT CORRECT BRANCH
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      # -------------------------
      # BOOST GRADLE MEMORY (Fix daemon crash)
      # -------------------------
      - name: Boost Gradle Memory
        run: |
          cat <<EOF >> android/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx2048m
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.workers.max=4
          android.enableDexingArtifactTransform=false
          EOF

      # -------------------------
      # DECODE KEYSTORE
      # -------------------------
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # -------------------------
      # INJECT SIGNING + FIREBASE APP ID
      # -------------------------
      - name: Create gradle.properties for signing
        run: |
          cat <<EOF >> android/gradle.properties
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          EOF

      # -------------------------
      # SET UP JAVA
      # -------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # -------------------------
      # AUTO VERSIONING
      # -------------------------
      - name: Auto Versioning
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 || echo "v0.0.0")
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="$LAST_TAG+build.$VERSION_CODE"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      # -------------------------
      # UPDATE APP VERSION
      # -------------------------
      - name: Update version in build.gradle
        run: |
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      # -------------------------
      # SET UP NODE / INSTALL DEPS
      # -------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node dependencies
        run: npm install

      # -------------------------
      # BUILD RELEASE APK
      # -------------------------
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      # -------------------------
      # UPLOAD SIGNED APK
      # -------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
